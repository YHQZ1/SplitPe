<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Pay via SplitPe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #09090f;
        --card: #111118;
        --border: #1e1e2e;
        --accent: #00d4a8;
        --text: #f0f0f5;
        --muted: #5a5a72;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        font-family: "DM Sans", sans-serif;
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }

      .wrap {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .amount-card {
        background: linear-gradient(135deg, #00d4a8, #00b894);
        border-radius: 20px;
        padding: 24px;
        color: #0a0a0f;
      }

      .amount-value {
        font-size: 42px;
        font-weight: 800;
      }

      .apps {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .app-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        color: var(--text);
        cursor: pointer;
      }

      .primary {
        border: 1px solid var(--accent);
      }

      .error-card {
        display: none;
        padding: 16px;
        border-radius: 12px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        text-align: center;
      }

      .error-card.show {
        display: block;
      }

      .loading {
        text-align: center;
        color: var(--muted);
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div id="loading" class="loading">Opening payment...</div>

      <div id="main" style="display: none">
        <div class="amount-card">
          <div>You owe</div>
          <div class="amount-value">₹<span id="amount"></span></div>
          <div id="name"></div>
          <div id="upi"></div>
        </div>

        <!-- ✅ PRIMARY BUTTON -->
        <button id="primary-pay" class="app-btn primary">
          Pay Now (Default UPI App)
        </button>

        <div class="apps" id="apps-list"></div>

        <div id="error-card" class="error-card">
          Couldn't open UPI app. Choose manually.
        </div>
      </div>
    </div>

    <script>
      function getParams() {
        const raw =
          window.location.hash.slice(1) || window.location.search.slice(1);
        if (!raw) return null;

        const p = {};
        raw.split("&").forEach((x) => {
          const [k, v] = x.split("=");
          if (k && v) p[decodeURIComponent(k)] = decodeURIComponent(v);
        });

        return p.pa && p.am ? p : null;
      }

      function buildQuery(p) {
        return `pa=${encodeURIComponent(p.pa)}&pn=${encodeURIComponent(p.pn || "")}&am=${p.am}&cu=INR&tn=${encodeURIComponent(p.tn || "SplitPe")}`;
      }

      function isAndroid() {
        return /android/i.test(navigator.userAgent);
      }

      function openUpi(url) {
        let opened = false;

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) opened = true;
        });

        window.location.href = url;

        setTimeout(() => {
          if (!opened) {
            document.getElementById("error-card").classList.add("show");
          }
        }, 1500);
      }

      function render(p) {
        const query = buildQuery(p);

        document.getElementById("amount").textContent = parseFloat(
          p.am,
        ).toFixed(2);
        document.getElementById("name").textContent = p.pn || "";
        document.getElementById("upi").textContent = p.pa;

        // ✅ primary button
        document.getElementById("primary-pay").onclick = () => {
          openUpi(`upi://pay?${query}`);
        };

        // app buttons
        const apps = [
          { name: "Google Pay", url: `gpay://upi/pay?${query}` },
          { name: "PhonePe", url: `phonepe://pay?${query}` },
          { name: "Paytm", url: `paytmmp://pay?${query}` },
          { name: "BHIM", url: `upi://pay?${query}` },
        ];

        const list = document.getElementById("apps-list");

        apps.forEach((a) => {
          const btn = document.createElement("button");
          btn.className = "app-btn";
          btn.innerText = a.name;
          btn.onclick = () => openUpi(a.url);
          list.appendChild(btn);
        });

        document.getElementById("loading").style.display = "none";
        document.getElementById("main").style.display = "block";

        // 🚀 AUTO OPEN (Android only)
        if (isAndroid()) {
          setTimeout(() => {
            openUpi(`upi://pay?${query}`);
          }, 400);
        }
      }

      window.onload = () => {
        const p = getParams();
        if (p) render(p);
      };
    </script>
  </body>
</html>
